version: '3.8'

services:
  # Database Service (PostgreSQL)
  # Uses small Alpine image to save RAM
  db:
    image: postgres:15-alpine
    container_name: burmaduta-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mypassword}
      POSTGRES_DB: ${DB_NAME:-burmaduta}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Service
  api:
    build: .
    container_name: burmaduta-api
    restart: always
    ports:
      - "8081:8081"
    environment:
      INTERNAL_STORE_URI: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-mypassword}@db:5432/${DB_NAME:-burmaduta}
      MODEL_NAME: ${MODEL_NAME}
      AI_PROMPT: ${AI_PROMPT}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy

  # Scraper Service
  scraper:
    build: .
    container_name: burmaduta-scraper
    restart: always
    command: python backend/scraper.py
    environment:
      INTERNAL_STORE_URI: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-mypassword}@db:5432/${DB_NAME:-burmaduta}
      SOURCE_API_ID: ${SOURCE_API_ID}
      SOURCE_API_HASH: ${SOURCE_API_HASH}
      SOURCE_CHANNELS: ${SOURCE_CHANNELS}
      PROCESSOR_KEY: ${PROCESSOR_KEY}
    volumes:
      - ./burmaduta_session.session:/app/burmaduta_session.session
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
