services:
  # Backend API Service
  api:
    build: .
    container_name: burmaduta-api
    restart: always
    ports:
      - "8081:8081"
    environment:
      INTERNAL_STORE_URI: ${INTERNAL_STORE_URI}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      API_KEY: ${API_KEY}

  # Scraper Service
  scraper:
    build: .
    container_name: burmaduta-scraper
    restart: always
    command: python backend/scraper.py
    environment:
      INTERNAL_STORE_URI: ${INTERNAL_STORE_URI}
    volumes:
      # Persistent session directory for Telegram login
      - ./sessions:/app/sessions
