services:
  # Reverse Proxy (HTTPS termination)
  caddy:
    image: caddy:2-alpine
    container_name: burmaduta-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # Backend API Service (internal only, not exposed to host)
  api:
    build: .
    container_name: burmaduta-api
    restart: always
    # NOTE: No 'ports' mapping — only accessible via Caddy reverse proxy
    expose:
      - "8081"
    environment:
      INTERNAL_STORE_URI: ${INTERNAL_STORE_URI}
      MODEL_NAME: ${MODEL_NAME:-gemini-2.5-flash-lite}
      AI_PROMPT: ${AI_PROMPT:-""}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}

  # Scraper Service
  scraper:
    build: .
    container_name: burmaduta-scraper
    restart: always
    command: python backend/scraper.py
    environment:
      INTERNAL_STORE_URI: ${INTERNAL_STORE_URI}
      SOURCE_API_ID: ${SOURCE_API_ID}
      SOURCE_API_HASH: ${SOURCE_API_HASH}
      SOURCE_CHANNELS: ${SOURCE_CHANNELS}
      PROCESSOR_KEY: ${PROCESSOR_KEY}
    volumes:
      # Persistent session directory for Telegram login
      - ./sessions:/app/sessions

volumes:
  caddy_data:
  caddy_config:
