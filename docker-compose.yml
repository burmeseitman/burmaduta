version: '3.8'

services:
  # Backend API Service
  api:
    build: .
    container_name: burmaduta-api
    restart: always
    ports:
      - "8081:8081"
    environment:
      # Directly use the Supabase URI from your .env file
      INTERNAL_STORE_URI: ${INTERNAL_STORE_URI}
      MODEL_NAME: ${MODEL_NAME}
      AI_PROMPT: ${AI_PROMPT}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    # Note: No internal DB dependency, uses external Supabase

    # Scraper Service
  scraper:
    build: .
    container_name: burmaduta-scraper
    restart: always
    command: python backend/scraper.py
    environment:
      INTERNAL_STORE_URI: ${INTERNAL_STORE_URI}
      SOURCE_API_ID: ${SOURCE_API_ID}
      SOURCE_API_HASH: ${SOURCE_API_HASH}
      SOURCE_CHANNELS: ${SOURCE_CHANNELS}
      PROCESSOR_KEY: ${PROCESSOR_KEY}
    volumes:
      # Persistent session directory for Telegram login
      - ./sessions:/app/sessions
