<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Burma Duta (ဗမာဒူတ) | Real-Time Mobile News Map</title>
  
  <meta name="description" content="Burma Duta real-time news intelligence and interactive crisis map for mobile." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://www.burmaduta.com/mobile.html" />

  <!-- Open Graph -->
  <meta property="og:title" content="Burma Duta (ဗမာဒူတ) | Mobile News Map" />
  <meta property="og:description" content="Autonomous real-time news intelligence and crisis mapping for Myanmar." />
  <meta property="og:image" content="https://www.burmaduta.com/assets/dashboard.png" />
  <meta property="og:url" content="https://www.burmaduta.com/mobile.html" />
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <!-- MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
  
  <link rel="stylesheet" href="mobile.css" />
</head>
<body>
  <!-- Map Container -->
  <div id="map"></div>

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="loading-overlay">
    <div class="loader-container">
      <div class="radar-spinner"></div>
      <div class="loader-text pulse-text">ခေတ္တစောင့်ဆိုင်းပေးပါ...</div>
      <div class="loader-subtext">Burma Duta is loading real-time data</div>
    </div>
  </div>

  <!-- Floating Header UI -->
  <div class="floating-header">
    <div class="header-top">
      <h1 class="logo" style="display: flex; align-items: center; gap: 8px;">
        ဗမာဒူတ
        <a href="feed.html" style="text-decoration: none; color: inherit; font-size: 1.1rem; display: inline-flex; align-items: center; background: rgba(255,255,255,0.08); padding: 4px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.08);" title="News Feed">
          📰
        </a>
      </h1>
      <div id="weather-widget" class="weather-widget">
        <span id="weather-icon">🌡️</span>
        <span id="weather-temp">--°C</span>
      </div>
    </div>
    
    <div class="search-row">
      <div class="search-container">
        <div class="search-icon">🔍</div>
        <input type="text" id="search-input" placeholder="Search incidents or locations..." />
        <button id="clear-search" style="display: none;">✕</button>
      </div>
      <button id="heatmap-toggle" class="heatmap-btn" title="Toggle Heatmap">🔥</button>
    </div>

    <!-- Category Chips (Horizontal Scroll) -->
    <div class="chips-container">
      <button class="chip modal-chip" id="region-chip">
        <span>🗺️</span> <span id="region-chip-text" class="chip-active-text">ပြည်နယ်/တိုင်း</span> <span>▼</span>
      </button>
      <button class="chip modal-chip" id="date-chip">
        <span>📅</span> <span id="date-chip-text" class="chip-active-text">Date</span> <span>▼</span>
      </button>
      <div class="chip-divider"></div>
      <button class="chip cat-chip active" data-category="All"><span>သတင်း</span></button>
      <button class="chip cat-chip" data-category="စစ်ရေးသတင်း"><span>စစ်ရေးသတင်း</span></button>
      <button class="chip cat-chip" data-category="မှုခင်းသတင်း"><span>မှုခင်းသတင်း</span></button>
      <button class="chip cat-chip" data-category="မတော်တဆဖြစ်မှု"><span>မတော်တဆဖြစ်မှု</span></button>
      <button class="chip cat-chip" data-category="သဘာဝဘေးအန္တရာယ်"><span>သဘာဝဘေးအန္တရာယ်</span></button>
      <button class="chip cat-chip" data-category="အထွေထွေ"><span>အထွေထွေ</span></button>
    </div>
  </div>

  <!-- Latest Critical List (Left Side) -->
  <div id="latest-critical-list" class="critical-list hidden">
    <div class="critical-list-title">⚡ အရေးပေါ် (Latest)</div>
    <div id="critical-list-items"></div>
  </div>

  <!-- Alert Card (Hidden by default) -->
  <div id="alert-card" class="alert-card hidden">
    <div class="alert-header">
      <h3 id="alert-title">⚠️ သတိပေးချက်</h3>
      <div class="pulse-indicator"></div>
    </div>
    <p id="alert-desc" class="alert-desc">Description goes here</p>
    <div class="alert-footer">
      <span id="alert-time" class="alert-time">Time</span>
      <span class="alert-read-more">READ FULL ALERT</span>
    </div>
  </div>

  <!-- Recenter Button -->
  <button id="recenter-btn" class="recenter-btn">🎯</button>

  <!-- Modals for Region and Date -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Select</h3>
        <button id="close-modal">✕</button>
      </div>
      <div id="modal-body" class="modal-body">
        <!-- Options injected here -->
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="geo-bounds.js"></script>
  <script src="mobile.js"></script>
</body>
</html>
